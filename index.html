<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6fb">
    <title>To-Do List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell container py-4 py-md-5">
      <header class="app-header mb-4 mb-md-5">
        <p class="eyebrow mb-2">하루를 차근차근</p>
        <h1 class="display-5 fw-bold mb-2">To-Do List</h1>
        <p class="text-secondary mb-0">작은 할 일부터 하나씩 완료해 보세요.</p>
      </header>

      <section class="app-card card border-0 shadow-sm" aria-label="할 일 관리">
        <div class="card-body p-3 p-md-4">
          <form id="todoForm" class="todo-form mb-3" novalidate>
            <label for="todoInput" class="form-label fw-semibold">새로운 할 일</label>
            <div class="input-group input-group-lg">
              <input
                id="todoInput"
                class="form-control"
                type="text"
                placeholder="예: 산책하기"
                aria-describedby="characterCount inputMessage">
              <button class="btn btn-primary px-4" type="submit">추가</button>
            </div>
            <div class="row g-3 mt-1">
              <div class="col-12 col-md-7">
                <label for="dueAtInput" class="form-label small fw-semibold">마감 일시 <span class="text-secondary fw-normal">(선택)</span></label>
                <input
                  id="dueAtInput"
                  class="form-control"
                  type="datetime-local"
                  aria-describedby="inputMessage">
              </div>
              <div class="col-12 col-md-5">
                <label for="priorityInput" class="form-label small fw-semibold">우선순위</label>
                <select id="priorityInput" class="form-select" aria-describedby="inputMessage">
                  <option value="medium" selected>보통</option>
                  <option value="high">높음</option>
                  <option value="low">낮음</option>
                </select>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-start gap-3 mt-2">
              <p id="inputMessage" class="form-message small mb-0" aria-live="polite"></p>
              <span id="characterCount" class="character-count small text-secondary text-nowrap">0/200</span>
            </div>
          </form>

          <div id="storageNotice" class="alert alert-warning py-2 small d-none" role="alert"></div>

          <section class="progress-panel rounded-4 p-3 p-md-4 mb-4" aria-label="진행 상황">
            <div class="row g-3 align-items-end mb-3">
              <div class="col-6">
                <p class="stat-label mb-1">전체 할 일</p>
                <p class="stat-value mb-0"><span id="totalCount">0</span><span class="stat-unit">개</span></p>
              </div>
              <div class="col-6 text-end">
                <p class="stat-label mb-1">완료한 할 일</p>
                <p class="stat-value mb-0"><span id="completedCount">0</span><span class="stat-unit">개</span></p>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
              <span class="small fw-semibold">오늘의 진행률</span>
              <span id="progressLabel" class="small fw-bold text-primary">0%</span>
            </div>
            <div
              class="progress progress-track"
              role="progressbar"
              aria-label="할 일 완료 진행률"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0">
              <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
            </div>
          </section>

          <section aria-label="할 일 목록">
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-3">
              <h2 class="h5 fw-bold mb-0">내 할 일</h2>
              <div class="btn-group filter-group" role="group" aria-label="할 일 필터">
                <button class="btn btn-outline-secondary active" type="button" data-filter="all" aria-pressed="true">전체</button>
                <button class="btn btn-outline-secondary" type="button" data-filter="active" aria-pressed="false">진행 중</button>
                <button class="btn btn-outline-secondary" type="button" data-filter="completed" aria-pressed="false">완료</button>
              </div>
            </div>
            <ul id="todoList" class="list-group todo-list" aria-live="polite" aria-relevant="additions removals text"></ul>
            <p id="emptyState" class="empty-state rounded-4 text-center text-secondary mb-0">
              할 일을 추가해 보세요!
            </p>
          </section>
        </div>
      </section>
      <dialog
        id="deleteDialog"
        class="delete-dialog"
        aria-labelledby="deleteDialogTitle"
        aria-describedby="deleteDialogDescription">
        <div class="delete-dialog-content">
          <div class="delete-dialog-icon" aria-hidden="true">
            <svg viewBox="0 0 96 96" role="img">
              <circle cx="48" cy="48" r="39" fill="#f5d8a7" />
              <path
                d="M19 34c8-13 22-21 38-20 10 1 19 5 26 12-8-3-15-3-22-1-10 3-17 9-26 11-6 1-11 1-16-2Z"
                fill="#8a6570" />
              <path
                d="M34 44c3-3 7-3 10 0m9 0c3-3 7-3 10 0"
                fill="none"
                stroke="#453c4d"
                stroke-linecap="round"
                stroke-width="3" />
              <path
                d="M39 64c5-6 13-8 20-5"
                fill="none"
                stroke="#453c4d"
                stroke-linecap="round"
                stroke-width="3" />
              <path d="M65 48c0 5-5 9-5 13a5 5 0 0 0 10 0c0-4-5-8-5-13Z" fill="#7599b8" />
              <path
                d="M21 58c4 13 15 23 29 26"
                fill="none"
                stroke="#d4a76a"
                stroke-linecap="round"
                stroke-width="3"
                opacity=".8" />
            </svg>
          </div>
          <p class="delete-dialog-eyebrow">마지막 확인</p>
          <h2 id="deleteDialogTitle">이 할 일을 삭제할까요?</h2>
          <p id="deleteDialogDescription" class="delete-dialog-task"></p>
          <p class="delete-dialog-hint">삭제한 할 일은 복구할 수 없어요.</p>
          <div class="delete-dialog-actions">
            <button id="cancelDelete" class="btn btn-outline-secondary" type="button">취소</button>
            <button id="confirmDelete" class="btn btn-danger" type="button">삭제하기</button>
          </div>
        </div>
      </dialog>
      <footer class="text-center text-secondary small mt-4">
        할 일은 이 브라우저에 자동으로 저장됩니다.
      </footer>
    </main>
  </body>
</html>
