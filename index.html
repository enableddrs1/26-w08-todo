<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="해야 할 일을 기록하고 진행 상황을 관리하는 To-Do List"
    />
    <title>To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col px-4 py-8 sm:px-6 sm:py-12">
      <header class="mb-8 text-center sm:mb-10">
        <p class="mb-3 text-sm font-semibold uppercase tracking-[0.24em] text-cyan-300">
          오늘도 차근차근
        </p>
        <h1 class="text-4xl font-bold tracking-tight text-white sm:text-5xl">To-Do List</h1>
        <p class="mt-3 text-sm text-slate-400 sm:text-base">
          해야 할 일을 기록하고, 하나씩 완료해 보세요.
        </p>
      </header>

      <section
        aria-label="할 일 관리"
        class="rounded-3xl border border-slate-800 bg-slate-900/90 p-4 shadow-2xl shadow-black/20 sm:p-7"
      >
        <form id="todo-form" class="flex flex-col gap-3 sm:flex-row sm:items-stretch">
          <label class="sr-only" for="todo-input">새 할 일</label>
          <textarea
            id="todo-input"
            name="todo"
            rows="2"
            placeholder="새로운 할 일을 입력하세요"
            aria-describedby="input-hint input-message"
            class="min-h-14 min-w-0 flex-1 resize-y rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-base text-white outline-none transition placeholder:text-slate-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20"
          ></textarea>
          <button
            type="submit"
            class="min-h-14 rounded-2xl bg-cyan-400 px-6 py-3 font-bold text-slate-950 transition hover:bg-cyan-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-300 sm:self-stretch"
          >
            추가하기
          </button>
        </form>
        <div class="mt-2 flex flex-wrap items-start justify-between gap-x-4 gap-y-1 text-xs sm:text-sm">
          <p id="input-hint" class="text-slate-500">최대 200자까지 입력할 수 있어요.</p>
          <p id="character-count" class="shrink-0 text-slate-500" aria-live="polite">0 / 200</p>
        </div>
        <p id="input-message" class="mt-2 hidden text-sm font-medium text-rose-300" role="alert"></p>
        <p id="storage-message" class="mt-3 hidden rounded-xl border border-amber-400/20 bg-amber-400/10 px-3 py-2 text-sm text-amber-200" role="status"></p>

        <section aria-labelledby="progress-heading" class="mt-8">
          <h2 id="progress-heading" class="sr-only">할 일 진행 상황</h2>
          <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">
            <div class="rounded-2xl border border-slate-800 bg-slate-950/70 p-4">
              <p class="text-sm text-slate-400">전체 할 일</p>
              <p id="total-count" class="mt-1 text-2xl font-bold text-white" aria-live="polite">0</p>
            </div>
            <div class="rounded-2xl border border-slate-800 bg-slate-950/70 p-4">
              <p class="text-sm text-slate-400">완료한 할 일</p>
              <p id="completed-count" class="mt-1 text-2xl font-bold text-white" aria-live="polite">0</p>
            </div>
            <div class="col-span-2 rounded-2xl border border-slate-800 bg-slate-950/70 p-4 sm:col-span-1">
              <div class="flex items-center justify-between gap-2">
                <p class="text-sm text-slate-400">진행률</p>
                <p id="progress-label" class="text-lg font-bold text-cyan-300" aria-live="polite">0%</p>
              </div>
              <div
                id="progress-track"
                class="mt-3 h-2.5 overflow-hidden rounded-full bg-slate-800"
                role="progressbar"
                aria-label="전체 할 일 완료율"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <div id="progress-fill" class="h-full w-0 rounded-full bg-cyan-400 transition-all duration-300"></div>
              </div>
            </div>
          </div>
        </section>

        <section aria-label="할 일 목록" class="mt-8">
          <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <h2 class="text-lg font-bold text-white">나의 할 일</h2>
            <div class="flex w-full rounded-xl bg-slate-950 p-1 sm:w-auto" role="group" aria-label="할 일 필터">
              <button
                type="button"
                class="filter-button min-h-10 flex-1 rounded-lg px-3 text-sm font-semibold transition sm:flex-none"
                data-filter="all"
                aria-pressed="true"
              >
                전체
              </button>
              <button
                type="button"
                class="filter-button min-h-10 flex-1 rounded-lg px-3 text-sm font-semibold transition sm:flex-none"
                data-filter="active"
                aria-pressed="false"
              >
                진행 중
              </button>
              <button
                type="button"
                class="filter-button min-h-10 flex-1 rounded-lg px-3 text-sm font-semibold transition sm:flex-none"
                data-filter="completed"
                aria-pressed="false"
              >
                완료
              </button>
            </div>
          </div>

          <p id="empty-state" class="hidden rounded-2xl border border-dashed border-slate-700 px-4 py-10 text-center text-slate-400"></p>
          <ul id="todo-list" class="space-y-3" aria-live="polite"></ul>
        </section>
      </section>

      <footer class="mt-auto pt-6 text-center text-xs leading-relaxed text-slate-500">
        <p>할 일 목록은 이 브라우저에 저장됩니다.</p>
      </footer>
    </main>
  </body>
</html>
